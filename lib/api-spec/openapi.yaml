openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: submissions
    description: Pitch deck submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /submissions:
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a pitch deck
      description: Submit a pitch deck with wallet address and details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getSubmissions
      tags: [submissions]
      summary: Get all submissions
      description: Returns all submissions with optional status filter
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
          description: Filter by status
      responses:
        "200":
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SubmissionInput:
      type: object
      required:
        - walletAddress
        - deckUrl
        - description
        - teamSize
      properties:
        walletAddress:
          type: string
          description: The connected wallet address
        deckUrl:
          type: string
          format: uri
          description: URL to the pitch deck (YouTube, DocSend, etc.)
        description:
          type: string
          description: Brief description of the project
        teamSize:
          type: integer
          description: Number of team members
        thumbnailUrl:
          type: string
          format: uri
          description: Optional uploaded thumbnail image URL
    Submission:
      type: object
      properties:
        id:
          type: integer
        walletAddress:
          type: string
        deckUrl:
          type: string
        thumbnailUrl:
          type: string
        description:
          type: string
        teamSize:
          type: integer
        status:
          type: string
        depositVerified:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - walletAddress
        - deckUrl
        - description
        - teamSize
        - status
        - depositVerified
        - createdAt
        - updatedAt
